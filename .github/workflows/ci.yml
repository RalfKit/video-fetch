name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: videofetch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (startup, migrations & health)
        run: |
          docker run -d --name videofetch-ci -p 3000:3000 videofetch:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo "\nHealth check passed"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "Health check did not pass in time"
            docker logs videofetch-ci
            docker rm -f videofetch-ci
            exit 1
          fi
          docker rm -f videofetch-ci
