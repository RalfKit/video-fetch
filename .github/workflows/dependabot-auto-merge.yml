name: Dependabot auto-merge

# Dependabot PRs (dependabot[bot] only):
# 1. Run the project's Prettier on the PR head. Human PRs are not formatted.
# 2. If that produces a diff, upload it. A separate workflow_run job (see
#    dependabot-format-push.yml) applies it and pushes with a PAT, because a
#    GITHUB_TOKEN push does not start new workflow runs and CI would stay stale.
# 3. Enable auto-merge for semver patch and minor updates only. Major bumps
#    stay open for review. GitHub merges only after required CI checks pass.
#
# The job that executes the PR's dependencies has contents: read and no
# repository secrets. Prettier from the updated lockfile therefore cannot push
# or read DEPENDABOT_FORMAT_TOKEN. The patch is validated again, from main's
# copy of the script, before anything is pushed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'main' &&
      startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Skip when this commit is already a format commit
        id: guard
        run: |
          set -euo pipefail
          message="$(git log -1 --format=%s)"
          if [ "${message}" = "style: apply prettier after dependency update" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      # The PR head does not contain this script until it is rebased. Load
      # main's copy so a newly merged validator cannot be replaced by the PR.
      - name: Download patch validator from main
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/validate-format-patch.mjs?ref=main" \
            > "${RUNNER_TEMP}/validate-format-patch.mjs"

      - name: Set up pnpm
        if: success() && steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        if: success() && steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the PR lockfile
        if: success() && steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''

      - name: Apply project Prettier
        if: success() && steps.guard.outputs.skip != 'true'
        run: pnpm exec prettier --write .
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''

      - name: Collect formatting diff
        id: patch
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No formatting changes."
            exit 0
          fi
          git -c core.hooksPath=/dev/null diff --no-ext-diff --no-textconv \
            > "${RUNNER_TEMP}/format.patch"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Validate formatting diff
        if: success() && steps.guard.outputs.skip != 'true' && steps.patch.outputs.changed == 'true'
        run: node "${RUNNER_TEMP}/validate-format-patch.mjs" "${RUNNER_TEMP}/format.patch"

      - name: Upload formatting diff
        if: success() && steps.guard.outputs.skip != 'true' && steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  auto-merge:
    needs: format
    if: >-
      github.actor == 'dependabot[bot]' &&
      needs.format.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Leave other updates for review
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        run: |
          echo "Not enabling auto-merge for ${{ steps.metadata.outputs.dependency-names }} (${{ steps.metadata.outputs.update-type }})."
